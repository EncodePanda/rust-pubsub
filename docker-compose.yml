services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  pubsub-init:
    image: curlimages/curl
    depends_on:
      - pubsub-emulator
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
    volumes:
      - ./scripts/init-emulator.sh:/init-emulator.sh:ro
    entrypoint: ["/bin/sh", "/init-emulator.sh"]

  api-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
    ports:
      - "3000:3000"

  risk-processor:
    build:
      context: .
      dockerfile: Dockerfile.risk
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
