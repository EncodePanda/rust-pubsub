[package]
name = "api-service"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
google-cloud-pubsub = { package = "gcloud-pubsub", version = "1" }
google-cloud-googleapis = { package = "gcloud-googleapis", version = "1" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.9"
futures-util = "0.3"
chrono = "0.4"
